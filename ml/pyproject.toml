[project]
name = "argus-ml"
version = "0.1.0"
description = "Argus — offline training, evaluation and monitoring pipeline for the risk engine"
# Upper bound is load-bearing, not cosmetic. With an open-ended ">=3.11",
# uv resolves for every future interpreter; shap -> numba -> llvmlite has no
# single release satisfying all of them, so the resolver backtracks to
# llvmlite 0.36 (2021), which then fails to build on anything past 3.9.
# Bounding the range keeps resolution on versions that actually exist as
# wheels. Matches the 3.11 used by the Dockerfile and CI.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyarrow>=17.0",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "mlflow>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
