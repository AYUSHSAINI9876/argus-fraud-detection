name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every Python step calls .venv/bin/<tool> directly rather than `uv run`.
# That is deliberate: `uv run` treats the directory as a uv project and
# performs its own resolution, ignoring the environment `uv pip install`
# just built. On this dependency graph it re-resolved shap -> numba ->
# llvmlite down to 2021 releases that cannot build on any supported Python,
# so the install step passed and the very next step failed. Invoking the
# venv's binaries removes that second resolution entirely — CI then runs
# exactly what was installed, which is the same property the application's
# train/serve parity check exists to guarantee.

jobs:
  ml:
    name: ML — lint, test, training smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Dependencies are pinned in pyproject.toml, not a committed
          # uv.lock. Without this glob the action looks for **/uv.lock,
          # finds nothing, and fails the job before any step runs.
          cache-dependency-glob: "**/pyproject.toml"

      # --python 3.11 is load-bearing. The runner defaults to 3.12, and
      # matching infra/api.Dockerfile means CI and the shipped image resolve
      # identically.
      - name: Install
        working-directory: ml
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          .venv/bin/python -c "import shap, numba, llvmlite, xgboost; print('shap', shap.__version__, '| llvmlite', llvmlite.__version__)"

      - name: Lint
        working-directory: ml
        run: .venv/bin/ruff check argus_ml

      - name: Unit tests
        working-directory: ml
        run: .venv/bin/pytest --cov=argus_ml --cov-report=term-missing

      # A model that trains is not the same as a model that is any good.
      # This gate trains on a small world and fails the build if the champion
      # cannot beat the logistic baseline — catching a feature-engineering
      # regression that unit tests would happily pass.
      - name: Training smoke + baseline gate
        working-directory: ml
        run: |
          .venv/bin/python -m argus_ml.train --customers 1500 --days 90 --out ./artifacts_ci
          .venv/bin/python - <<'PY'
          import json, sys
          reports = json.load(open("artifacts_ci/evaluation.json"))
          by = {r["model_name"]: r for r in reports}
          base = by["logistic_baseline"]["pr_auc"]
          champ = by["xgboost_risk"]["pr_auc"]
          print(f"baseline PR-AUC {base:.4f} | champion PR-AUC {champ:.4f}")
          if champ <= base:
              sys.exit(f"REGRESSION: champion {champ:.4f} did not beat baseline {base:.4f}")
          print("baseline gate passed")
          PY

  api:
    name: API — lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install
        working-directory: api
        run: |
          uv venv --python 3.11
          uv pip install -e "../ml" -e ".[dev]"
          .venv/bin/python -c "import fastapi, sqlalchemy, alembic; print('fastapi', fastapi.__version__)"

      - name: Lint
        working-directory: api
        run: .venv/bin/ruff check app

      # Apply migrations against a real Postgres, then assert the resulting
      # schema matches the models. `alembic check` fails if autogenerate would
      # produce a non-empty diff — i.e. if a model changed without a migration.
      # Without this, schema drift is only discovered on deploy.
      - name: Migrations apply and match models
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://argus:argus@localhost:5432/argus_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Tests
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://argus:argus@localhost:5432/argus_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_ENABLED: "false"
        run: .venv/bin/pytest

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Strict `npm ci`, with no `|| npm install` fallback. The fallback hid a
      # genuinely out-of-sync lock file: the install step went green while
      # resolving a different dependency tree than the one committed, which is
      # exactly the drift a lock file exists to prevent.
      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
