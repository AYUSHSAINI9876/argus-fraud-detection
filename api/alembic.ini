# Alembic configuration.
#
# The database URL is deliberately NOT set here — `alembic/env.py` reads it
# from the same `Settings` object the application uses, so migrations can
# never be run against a different database than the one the API talks to,
# and no credentials live in a checked-in file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, slugged revision filenames so `ls versions/` reads
# chronologically instead of as a pile of opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
